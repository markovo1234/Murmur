# The iPhone app. Generate the Xcode project with XcodeGen:  brew install xcodegen && cd ios && xcodegen
name: Murmur
options:
  bundleIdPrefix: app.murmur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MurmurCore:
    path: MurmurCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Murmur:
    type: application
    platform: iOS
    sources:
      - path: Murmur
    dependencies:
      - package: MurmurCore
    info:
      path: Murmur/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Murmur talks to people nearby over Bluetooth. No internet, no accounts.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.murmur
        PRODUCT_NAME: Murmur
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  MurmurTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MurmurTests
    dependencies:
      - target: Murmur
      - package: MurmurCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Murmur:
    build:
      targets:
        Murmur: all
        MurmurTests: [test]
    test:
      targets: [MurmurTests]
