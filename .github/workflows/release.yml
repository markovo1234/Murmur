name: Release

# Pushing a tag (e.g. `git tag v1.3.1 && git push origin v1.3.1`) builds that version and publishes a
# GitHub Release with Murmur-<tag>.apk and Murmur-<tag>-debug.apk attached. Run it manually with an
# existing tag to (re)build the release of an older version. Release notes come from
# .github/release-notes/<tag>.md on main.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for (e.g. v1.3.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish the APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          # All history, so the notes can be read from main even for tags that predate them.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Tests and lint already ran for this commit in the Build workflow.
      - name: Build APKs
        run: ./gradlew --no-daemon :app:dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp dist/Murmur.apk "Murmur-$TAG.apk"
          cp dist/Murmur-debug.apk "Murmur-$TAG-debug.apk"
          assets=("Murmur-$TAG.apk" "Murmur-$TAG-debug.apk")

          notes_args=(--generate-notes)
          if git show "origin/main:.github/release-notes/$TAG.md" > notes.md 2>/dev/null; then
            notes_args=(--notes-file notes.md)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            if [ -s notes.md ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            fi
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Murmur $TAG" \
              --verify-tag \
              "${notes_args[@]}"
          fi
