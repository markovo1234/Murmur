name: iOS

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: MurmurCore tests (CryptoKit vectors)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Test
        working-directory: ios/MurmurCore
        run: swift test

  app:
    name: iPhone app (tests + unsigned IPA)
    needs: core
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen
          xcodebuild -version

      - name: App tests (iPhone simulator)
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $DEVICE"
          xcodebuild test -project Murmur.xcodeproj -scheme Murmur -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee test.log | grep -E "error:|warning: .*(deprecated|never|unused)|Test Case .*(passed|failed)|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Build unsigned IPA
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project Murmur.xcodeproj -scheme Murmur -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 \
            | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Murmur.app Payload/
          zip -qry Murmur-unsigned.ipa Payload
          ls -la Murmur-unsigned.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: Murmur-iOS-unsigned
          path: ios/Murmur-unsigned.ipa

      - name: Logs on failure
        if: failure()
        working-directory: ios
        run: |
          for f in test.log build.log; do [ -f $f ] && { echo "== $f"; grep -E "error:" -A3 $f | head -150; }; done; true
