name: Build

on:
  push:
    # Branches only: tag pushes are built by the Release workflow.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue :core:test :app:lintDebug :app:dist 2>&1 | tee build.log || {
            grep -E "^e: |error:|Error:|What went wrong|^> " build.log | head -60 | sed 's/^/::error::/'
            find app/build/reports -name "lint-results*.txt" -exec cat {} \; 2>/dev/null | grep -E "Error|error" | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: Murmur-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
