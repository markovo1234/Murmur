name: Build

on:
  push:
    # Branches only: tag pushes are built by the Release workflow.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Compiler errors, lint findings and failed tests show up as annotations on the run and the commit.
      - name: Register problem matchers
        run: echo "::add-matcher::.github/matchers/gradle.json"

      - name: Test, lint and build
        run: ./gradlew --no-daemon --continue :core:test :app:lintDebug :app:dist

      # Gradle prints only the first lint error; the text report lists all of them for the matcher.
      - name: Show lint findings
        if: failure()
        run: cat app/build/reports/lint-results-debug.txt 2>/dev/null || true

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: Murmur-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
