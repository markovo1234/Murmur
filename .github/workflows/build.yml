name: Build

on:
  push:
    # Branches only: tag pushes are built by the Release workflow.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue :core:test :app:lintDebug :app:dist 2>&1 | tee build.log || {
            { grep -E "^e: |^w: .*(error)|Error: |^\* What went wrong" -A2 build.log | grep -v "^--$" | head -120
              find app/build -name "lint-results*.txt" -exec grep -E "Error|error:" {} + 2>/dev/null | head -40; } > errs.txt
            msg=$(sed 's/%/%25/g' errs.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=build::${msg}"
            exit 1
          }

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: Murmur-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
